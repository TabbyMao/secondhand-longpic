<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二手长图拼接</title>
<style>
/* 简洁浅色风，固定浅色主题，不跟随系统。布局：左边编辑 + 清单，右边长图；手机上一列 */
:root, :root[data-theme="dark"], :root[data-theme="light"]{
  --page:#f5f7ee; --bg:#f1f3f6; --surface:#ffffff; --ink:#1b2027; --muted:#66707b; --line:#dde2e8;
  --accent:#ffe9a6; --accent-ink:#4a3712; --danger:#c0392b;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--page)}
body{
  min-height:100vh;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  background-color:var(--page);
  background-image:
    radial-gradient(45vw 45vh at 4% 4%, rgba(248,190,206,.78), transparent 70%),
    radial-gradient(40vw 40vh at 50% 0%, rgba(255,214,186,.70), transparent 70%),
    radial-gradient(45vw 50vh at 98% 6%, rgba(218,200,246,.78), transparent 70%),
    radial-gradient(40vw 45vh at 100% 55%, rgba(190,224,186,.80), transparent 70%),
    radial-gradient(45vw 45vh at 60% 100%, rgba(250,196,214,.65), transparent 70%),
    radial-gradient(45vw 45vh at 92% 98%, rgba(164,210,162,.75), transparent 70%),
    radial-gradient(45vw 50vh at 0% 60%, rgba(206,232,198,.70), transparent 70%),
    radial-gradient(45vw 45vh at 4% 98%, rgba(255,232,170,.80), transparent 70%);
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.02em}
h1 mark{background:var(--accent);color:var(--accent-ink);padding:2px 12px;border-radius:12px}
.tagline{margin:0;color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 1px 2px rgba(40,30,60,.05),0 10px 28px rgba(50,80,40,.09)}
h2{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--muted);font-size:13px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:34px}
button:hover{border-color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.small{padding:3px 9px;min-height:28px;font-size:13px}
button.danger{color:var(--danger)}
button.ghost{border-style:dashed}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:64px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>label{flex:1 1 120px}
.note{font-size:13px;color:var(--muted);margin:0}
.status{font-size:13px;color:var(--muted)}
.lang,.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button,.seg button{border:none;border-radius:0;background:var(--bg);font-size:13px;min-height:32px}
.seg button{flex:1}
.lang button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface);font-weight:700}
.pick{position:relative;border:1.5px dashed var(--muted);border-radius:8px;padding:12px;text-align:center;cursor:pointer;color:var(--ink);font-size:14px}
.pick:hover{border-color:var(--ink)}
.pick.drag{border-color:var(--ink);border-style:solid;background:var(--accent);color:var(--accent-ink)}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;min-height:0;width:20px;height:20px;padding:0;border-radius:50%;line-height:1;font-size:13px;background:rgba(0,0,0,.65);color:#fff;border:none}
.item .thumb{width:48px;height:48px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.item.on{border-color:var(--gc,var(--ink));box-shadow:inset 5px 0 0 var(--gc,var(--accent))}
.item.sold{opacity:.55}
.item input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink)}
.item .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.desc{font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.desc .alt{display:block;color:var(--muted);font-size:12px}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.sold{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill.warn{border-color:#d08a1a;color:#a8670a}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--gc,#888);padding:1px 8px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.banner{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.out{display:flex;flex-direction:column;gap:14px}
.shot{display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--gc,#888);padding-left:10px}
.shot .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.shot .meta .info{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.shot .meta b{font-variant-numeric:tabular-nums}
.shot .names{font-size:13px;color:var(--muted)}
.scroll{max-height:70vh;overflow-y:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.scroll img{max-width:100%;display:block}
.check{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.empty{font-size:13px;color:var(--muted);margin:0}
.sharebar{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sharehead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.dotmode{width:9px;height:9px;border-radius:50%;background:#9aa3ab;flex:none}
.dotmode.shared{background:#1f9d6a}
.dotmode.err{background:#c0392b}
.shareline{display:flex;gap:6px}
.shareline input{flex:1;min-width:0;background:#fff;font-size:13px}
.filebtn{display:inline-flex;align-items:center;flex-direction:row;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;min-height:28px;font-size:13px;color:var(--ink)}
.filebtn:hover{border-color:var(--ink)}
.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
[hidden]{display:none!important}
.row.top{align-items:flex-start}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs .tab{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;min-height:30px;border-radius:99px;background:var(--surface)}
.tabs .tab i{width:10px;height:10px;border-radius:50%;background:var(--gc);display:inline-block}
.tabs .tab[aria-pressed=true]{border-color:var(--gc);box-shadow:inset 0 0 0 1px var(--gc);font-weight:700;background:color-mix(in srgb, var(--gc) 10%, #fff)}
.groupbar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:10px;border-radius:8px;background:var(--bg);border-left:5px solid var(--gc,#888)}
.groupbar label{flex:1 1 180px}
.groupbar input[type=text],.groupbar textarea{background:#fff}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag.dim{opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><mark id="tTitle">二手长图拼接</mark></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="cols">
    <div class="col">
      <section class="card" id="editor">
        <h2 id="edTitle"></h2>
        <label class="pick" for="files"><input type="file" id="files" accept="image/*" multiple><span id="tPick"></span></label>
        <div class="thumbs" id="edThumbs"></div>
        <div class="row top">
          <label for="price" style="flex:0 1 130px"><span id="tPrice"></span><input type="text" id="price" placeholder="20" autocomplete="off"></label>
          <label for="desc" style="flex:3 1 230px"><span id="tDesc"></span><textarea id="desc" rows="2"></textarea></label>
        </div>
        <div class="row" style="align-items:center">
          <button class="primary" id="saveBtn" type="button"></button>
          <button id="cancelBtn" type="button" class="ghost" hidden></button>
          <span class="status" id="edMsg" role="status"></span>
        </div>
      </section>

      <section class="card">
        <h2><span id="tList"></span> <small id="count"></small></h2>
        <div class="sharebar" id="sharebar">
          <div class="sharehead"><span class="dotmode" id="modeDot"></span><span id="shareStatus"></span></div>
          <div class="shareline" id="linkRow" hidden><input type="text" id="shareLink" readonly aria-label="Share link"><button class="small" id="copyLink" type="button"></button></div>
          <div class="acts">
            <button class="small" id="shareBtn" type="button" hidden></button>
            <button class="small" id="lastShare" type="button" hidden></button>
            <button class="small" id="resync" type="button" hidden></button>
            <button class="small" id="leaveShare" type="button" hidden></button>
            <button class="small" id="exportBtn" type="button"></button>
            <label class="small filebtn" for="importFile"><input type="file" id="importFile" accept=".json,application/json"><span id="tImport"></span></label>
          </div>
          <p class="note" id="shareMsg" role="status" hidden></p>
        </div>
        <div class="banner" id="exBanner" hidden><span id="tEx"></span><button class="small" id="clearEx" type="button"></button></div>
        <div class="tabs" id="tabs" role="group"></div>
        <div class="groupbar" id="groupbar">
          <label for="gname"><span id="tGName"></span><input type="text" id="gname" autocomplete="off"></label>
          <label class="check" for="gshow" style="flex:0 0 auto;align-self:center"><input type="checkbox" id="gshow"><span id="tGShow"></span></label>
          <label for="gnote" style="flex:1 1 100%"><span id="tGNote"></span><textarea id="gnote" rows="2"></textarea></label>
          <button class="small" id="selAll" type="button"></button>
          <button class="small" id="selNone" type="button"></button>
          <button class="small danger" id="delGroup" type="button"></button>
        </div>
        <div class="acts"><button class="small ghost" id="fillTr" type="button" hidden></button></div>
        <div class="list" id="list"></div>
        <p class="note" id="storeNote"></p>
        <p class="note" id="trNote" hidden></p>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <h2><span id="tOut"></span> <small id="genInfo"></small></h2>
        <div class="seg" role="group" id="segQ">
          <button type="button" data-q="s" aria-pressed="false"></button>
          <button type="button" data-q="m" aria-pressed="true"></button>
          <button type="button" data-q="l" aria-pressed="false"></button>
        </div>
        <div class="row" style="align-items:center;justify-content:space-between">
          <span class="note" style="color:var(--muted);font-size:13px" id="tPos"></span>
          <div class="seg" role="group" id="segP" style="flex:0 1 260px">
            <button type="button" data-p="above" aria-pressed="true"></button>
            <button type="button" data-p="below" aria-pressed="false"></button>
          </div>
        </div>
        <div class="row">
          <label for="cur"><span id="tCur"></span><input type="text" id="cur" value="$" maxlength="3"></label>
        </div>
        <label class="check" for="num"><input type="checkbox" id="num" checked><span id="tNum"></span></label>
        <div class="out" id="out"></div>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------- 文案 ---------- */
const T = {
  zh:{
    title:'二手长图拼接', add:'添加物品', edit:'编辑物品', pick:'选择照片，或把照片拖到这里', price:'价格', desc:'描述', descPh:'宜家台灯，九成新，带灯泡，自取',
    save:'保存到清单', saveEdit:'保存修改', cancel:'取消编辑',
    needPhoto:'先选至少一张照片。', compress:'正在压缩照片…', badPhoto:'有一张照片读不出来，换成 JPG 或 PNG 再试。', saved:'已保存 ✓',

    createShare:'创建共享清单', shareArm:'再点一次：把当前物品复制到共享清单', uploading:(a,b)=>`正在上传 ${a}/${b}…`, copyLink:'复制链接', copied:'已复制 ✓',

  },
  en:{
    title:'Yard Sale Long Pic', add:'Add an item', edit:'Edit item', pick:'Choose photos, or drag them here', price:'Price', desc:'Description', descPh:'IKEA desk lamp, like new, bulb included, pickup only',
    save:'Save to list', saveEdit:'Save changes', cancel:'Cancel',
    needPhoto:'Choose at least one photo first.', compress:'Compressing photos…', badPhoto:'One photo could not be read. Try a JPG or PNG.', saved:'Saved ✓',
    list:'Item list', ex:'These are sample items so you can see how it works.', clearEx:'Remove samples',
    newImg:'+ New long image', gname:'Image name', gnamePh:'e.g. Badminton, Kitchen', gshow:'Show name at the top of the image',

    selAll:'Select all for sale', selNone:'Select none', none:'No items yet', count:(l,o)=>`${l} for sale · ${o} in this image`,

let lang = 'zh';
const t = k => T[lang][k];
const other = l => l === 'zh' ? 'en' : 'zh';

function applyLang(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  const set = (id, k) => { $(id).textContent = t(k); };
  set('tTitle','title'); set('tPick','pick'); set('tPrice','price'); set('tDesc','desc');
  set('cancelBtn','cancel'); set('tList','list'); set('tEx','ex'); set('clearEx','clearEx'); set('selAll','selAll'); set('selNone','selNone');
  set('tGName','gname'); set('tGShow','gshow'); set('exportBtn','exportBtn'); set('tImport','importBtn'); set('copyLink','copyLink'); set('leaveShare','leave'); set('lastShare','lastShare'); set('resync','resync'); if(!$('shareBtn').dataset.arm) set('shareBtn','createShare'); renderShareBar(); set('tPos','pos'); document.querySelector('[data-p=above]').textContent = t('above'); document.querySelector('[data-p=below]').textContent = t('below'); set('tGNote','gnote'); $('gnote').placeholder = t('gnotePh'); set('delGroup','delGroup'); set('tOut','out'); set('tCur','cur'); set('tNum','num');
  $('desc').placeholder = t('descPh'); $('gname').placeholder = t('gnamePh');
  document.querySelector('[data-q=s]').textContent = t('qs');
  document.querySelector('[data-q=m]').textContent = t('qm');
  document.querySelector('[data-q=l]').textContent = t('ql');

    'Keep it natural and concise like a real listing; keep numbers, sizes, units and brand names; do not add information. ' +

  if(!sample){

async function shrink(file){
  let src;
  try{ src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const sw = src.width, sh = src.height, k = Math.min(1, IMPORT_MAX/Math.max(sw,sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw*k); c.height = Math.round(sh*k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return await new Promise(res => c.toBlob(res, 'image/jpeg', .85));
}

/* ---------- 长图排版 ---------- */
function splitRows(n){
  if(n <= 3) return [n]; if(n === 4) return [2,2];
  const r = []; while(n > 0){ if(n === 4){ r.push(2,2); break; } r.push(Math.min(3,n)); n -= 3; } return r;
}
function wrap(g, text, maxW){
  const lines = [];
  for(const para of String(text).split(/\n/)){
    const toks = para.match(/[A-Za-z0-9$¥€£.,:;!?%#@&()\-+/'"]+|\s+|./gu) || [];
    let cur = '';
    for(const tk of toks){
      if(g.measureText(cur + tk).width <= maxW){ cur += tk; continue; }
      if(cur.trim()) lines.push(cur.trimEnd());
      cur = tk.trim() ? tk : '';
      while(g.measureText(cur).width > maxW && cur.length > 1){
        let k = cur.length - 1; while(k > 1 && g.measureText(cur.slice(0,k)).width > maxW) k--;
        lines.push(cur.slice(0,k)); cur = cur.slice(k);
      }
    }
    if(cur.trim()) lines.push(cur.trimEnd());
  }
  return lines;
}
const FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif';
function layout(g, group, W, numbered, title, note){
  const P = Math.round(W*.035), PV = Math.round(W*.09), gap = Math.round(W*.012), sep = Math.round(W*.075);   // PV：上下留白，避开曲面屏边缘
  const fs1 = Math.round(W*.054), fs2 = Math.round(W*.037), inner = W - 2*P, ops = [];
  let y = PV;
  if(title){
    const fsT = Math.round(W*.072);
    g.font = `800 ${fsT}px ${FONT}`;
    for(const ln of wrap(g, title, inner)){ ops.push({text:ln, font:g.font, x:P, y:y + fsT}); y += Math.round(fsT*1.25); }
    y += Math.round(fsT*.25);
    ops.push({rule:true, x:P, y, w:inner, h:Math.max(2, Math.round(W*.003))});
    y += Math.round(W*.04);
  }
  group.forEach((it, i) => {
    const textBlock = () => {
      const y0 = y;
      const head = [numbered ? (i+1)+'.' : '', fmtPrice(it.price)].filter(Boolean).join(' ');
      if(head){ g.font = `700 ${fs2}px ${FONT}`; for(const ln of wrap(g, head, inner)){ ops.push({text:ln, font:g.font, x:P, y:y + fs2}); y += Math.round(fs2*1.45); } }
      const d = descOf(it);
      if(d){ g.font = `400 ${fs2}px ${FONT}`; for(const ln of wrap(g, d, inner)){ ops.push({text:ln, font:g.font, x:P, y:y + fs2}); y += Math.round(fs2*1.45); } }
      return y > y0;
    };
    if(textPos === 'above'){ if(textBlock()) y += Math.round(fs2*.35); }
    let k = 0;
    for(const n of splitRows(it.imgs.length)){
      const row = it.imgs.slice(k, k+n); k += n;
      const sum = row.reduce((s,im) => s + im.naturalWidth/im.naturalHeight, 0);
      let h = (inner - gap*(n-1)) / sum, x = P;
      const hMax = W*1.05;
      if(h > hMax){ h = hMax; x = P + (inner - (sum*h + gap*(n-1)))/2; }
      h = Math.round(h);
      row.forEach((im, j) => {
        const r = im.naturalWidth/im.naturalHeight;
        const w = j === n-1 && x + r*h > W - P - 2 ? (W - P - x) : Math.round(r*h);
        ops.push({im, x:Math.round(x), y, w, h}); x += w + gap;
      });
      y += h + gap;
    }
    if(textPos === 'above') y -= gap;
    else { y += Math.round(fs2*.45); textBlock(); }
    y += i < group.length-1 ? sep : (note ? Math.round(W*.045) : PV);
  });
  if(note){
    ops.push({rule:true, x:P, y, w:inner, h:Math.max(2, Math.round(W*.003))});
    y += Math.round(W*.04);
    g.font = `400 ${fs2}px ${FONT}`;
    for(const ln of wrap(g, note, inner)){ ops.push({text:ln, font:g.font, x:P, y:y + fs2}); y += Math.round(fs2*1.45); }
    y += PV;
  }
  return {H:Math.ceil(y), ops};
}
async function build(group, title, note){
  const pr = PRESETS[preset], numbered = $('num').checked;
  for(const it of group) it.imgs = await Promise.all(it.photos.map(loadImg));
  const c = document.createElement('canvas'), g = c.getContext('2d');
  let W = pr.w, L = layout(g, group, W, numbered, title, note);
  if(W*L.H > MAX_AREA){ W = Math.floor(W*Math.sqrt(MAX_AREA/(W*L.H))*.98); L = layout(g, group, W, numbered, title, note); }
  c.width = W; c.height = L.H;
  g.fillStyle = '#fff'; g.fillRect(0,0,W,L.H);
  g.imageSmoothingQuality = 'high'; g.textBaseline = 'alphabetic';
  for(const o of L.ops){
    if(o.rule){ g.fillStyle = '#d9d9d9'; g.fillRect(o.x, o.y, o.w, o.h); }
    else if(o.im) g.drawImage(o.im, o.x, o.y, o.w, o.h);
    else{ g.font = o.font; g.fillStyle = '#000'; g.fillText(o.text, o.x, o.y); }
  }
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', pr.q));
  const out = {blob, W, H:L.H}; c.width = c.height = 1; return out;
}

function fakePhoto(hue, shape, w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,w,h); gr.addColorStop(0,`hsl(${hue} 30% 86%)`); gr.addColorStop(1,`hsl(${hue} 30% 68%)`);
  g.fillStyle = gr; g.fillRect(0,0,w,h); g.fillStyle = `hsl(${hue} 35% 38%)`;
  const cx = w/2, cy = h/2, s = Math.min(w,h)*.28;
  if(shape === 0){ g.beginPath(); g.arc(cx,cy,s,0,7); g.fill(); }
  else if(shape === 1){ g.fillRect(cx-s, cy-s*1.2, s*2, s*2.4); }
  else{ g.beginPath(); g.moveTo(cx,cy-s*1.2); g.lineTo(cx+s*1.2,cy+s); g.lineTo(cx-s*1.2,cy+s); g.fill(); }
  g.fillStyle = 'rgba(0,0,0,.5)'; g.font = `600 ${Math.round(w*.055)}px ${FONT}`; g.fillText('sample 示例', w*.05, h*.95);
  return new Promise(res => c.toBlob(res, 'image/jpeg', .8));
}

  try{
    const l = localStorage.getItem('lp_lang'); if(l === 'zh' || l === 'en') lang = l;
    const p = localStorage.getItem('lp_preset'); if(p && PRESETS[p]){ preset = p; document.querySelectorAll('#segQ button').forEach(x => x.setAttribute('aria-pressed', x.dataset.q === p)); }
    const pp = localStorage.getItem('lp_pos'); if(pp === 'above' || pp === 'below'){ textPos = pp; document.querySelectorAll('#segP button').forEach(x => x.setAttribute('aria-pressed', x.dataset.p === pp)); }
    const cur = localStorage.getItem('lp_cur'); if(cur !== null) $('cur').value = cur;
    const num = localStorage.getItem('lp_num'); if(num !== null) $('num').checked = num === '1';
  }catch(e){}
  applyLang(); resetEditor();
  if(SHARE){
    try{ localStorage.setItem('lp_last_share', SHARE); }catch(e){}
    showStore(); renderShareBar();
    try{ await pull(true); }catch(e){ console.error(e); loadError = t('loadFail'); }
    if(!loadError && !groups.length){ newGroup(); }
    if(!loadError){ await repairLang(); setTimeout(autoTranslate, 500); }
    renderAll(); generate(); renderShareBar(); startPolling();
    return;
  }
  db = await openDB(); persistent = !!db;
  const all = await dbAll();
  const gRec = all.find(x => x && x.id === GROUPS_KEY);
  items = all.filter(x => x && x.id !== GROUPS_KEY && Array.isArray(x.photos) && x.photos.length);
  for(const it of items){                         // 旧版本只有 desc 字段
    if(it.desc && !it.zh && !it.en){ const s = detect(it.desc); it[s] = it.desc; it.src = s; delete it.desc; await dbPut(it); }
  }
  persistent = !!db; showStore();
  let seeded = false; try{ seeded = localStorage.getItem('lp_seeded') === '1'; }catch(e){}
  if(!items.length && !(persistent && seeded)){ await seed(); store('lp_seeded', '1'); }
  items.sort((a,b) => a.order - b.order);
  if(gRec && Array.isArray(gRec.groups)){
    const ok = new Set(items.map(x => x.id));
    groups = gRec.groups.map(g => ({id:g.id, name:g.name || '', show:!!g.show, note:g.note || '', ids:new Set((g.ids || []).filter(id => ok.has(id)))}));
    active = groups.some(g => g.id === gRec.active) ? gRec.active : (groups[0] && groups[0].id) || null;
  }else{
    // 第一次用分组：把之前勾选的物品按每 10 件放进长图（旧版的 sel 字段）
    const per = (() => { try{ return Math.min(20, Math.max(1, parseInt(localStorage.getItem('lp_per'),10) || 10)); }catch(e){ return 10; } })();
    const chosen = items.filter(x => x.sel !== false && !x.sold);
    for(let i = 0; i < chosen.length; i += per){ const g = newGroup(); chosen.slice(i, i+per).forEach(x => g.ids.add(x.id)); }
    if(!groups.length) newGroup();
    active = groups[0].id; saveGroups();
  }
  await repairLang();
  renderAll(); generate(); autoTranslate();
  try{
    if(!STANDALONE){
      const [d, s] = await Promise.all([window.claude.use('downloads').catch(() => null), window.claude.use('sample').catch(() => null)]);
      downloads = d; sample = s;
      if(!sample){ $('trNote').textContent = t('trOff'); $('trNote').hidden = !items.some(missing); }
      renderList(); if(downloads) generate();
    }
  }catch(e){}
})();
})();
</script>
</body>
</html>
